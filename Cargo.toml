[package]
name = "embeddinggemma-2"
version = "0.1.0"
edition = "2021"
description = "Candle implementation of Google's EmbeddingGemma 2 multimodal embedding model"
license = "MIT OR Apache-2.0"

[lib]
name = "embeddinggemma2"

[dependencies]
candle = { package = "candle-core", version = "0.11" }
candle-nn = "0.11"
hf-hub = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"

[features]
default = []
cuda = ["candle/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle/cudnn"]
metal = ["candle/metal", "candle-nn/metal"]
mkl = ["candle/mkl", "candle-nn/mkl"]
accelerate = ["candle/accelerate", "candle-nn/accelerate"]

[profile.dev]
opt-level = 2

[profile.release]
debug = 1
